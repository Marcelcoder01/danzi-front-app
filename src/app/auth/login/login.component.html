<div
  class="login-wrapper relative min-h-screen overflow-hidden grid place-items-center text-white bg-[#111018]"
>
  <!-- Background video -->
  <video
    #loginVideo
    class="absolute inset-0 w-full h-full object-cover z-0 brightness-[.35] saturate-[.75] blur-[4.5px] scale-[1.03]"
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="/assets/video/Dance-video-login.mp4" type="video/mp4" />
  </video>

  <!-- Visual overlays -->
  <div class="absolute inset-0 z-1 bg-[rgba(10,8,20,.3)]"></div>
  <div
    class="absolute w-[350px] h-[350px] rounded-full blur-[100px] opacity-[.15] pointer-events-none z-3 top-[-180px] right-[-100px] bg-[var(--color-accent)]"
  ></div>
  <div
    class="absolute w-[350px] h-[350px] rounded-full blur-[100px] opacity-[.15] pointer-events-none z-3 bottom-[-180px] left-[-100px] bg-[var(--color-secondary-light)]"
  ></div>

  <!-- Content -->
  <main
    class="relative z-10 w-full min-h-screen grid place-items-center p-6 animate-[login-enter_.6s_ease-out]"
  >
    <section
      class="login-card w-full max-w-[420px] p-10 rounded-3xl bg-[rgba(20,18,30,0.391)] backdrop-blur-[24px] saturate-[130%] shadow-[0_25px_70px_rgba(0,0,0,.4),inset_0_1px_rgba(255,255,255,.12)]"
    >
      <!-- Brand -->
      <div class="flex justify-center items-center">
        <img
          src="/assets/img/00-LOGO-BLANCO-PNG.png"
          alt="Danzi Logo"
          class="w-32 h-32 object-contain scale-125"
        />
      </div>

      <!-- Header -->
      <div class="mb-8">
        <h1 class="m-0 text-[clamp(1.8rem,5vw,2.15rem)] font-semibold tracking-[-.04em]">
          Bienvenido de nuevo
        </h1>

        <p class="mt-3 text-white/55 text-[.88rem] leading-[1.55]">Introduce tus credenciales</p>
      </div>

      <!-- Form -->
      <form class="flex flex-col gap-[1.15rem]" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <label class="flex flex-col gap-[.5rem]">
          <span class="text-white/72 text-[.76rem]">Email</span>

          <div
            class="login-input-wrapper h-[50px] flex items-center gap-[.7rem] px-[.9rem] rounded-xl bg-black/16"
          >
            <fa-icon [icon]="faEnvelope" size="sm" class="text-white/40"></fa-icon>

            <input
              type="email"
              placeholder="tu@email.com"
              autocomplete="email"
              class="w-full h-full border-0 outline-none focus:outline-none focus:ring-0 bg-transparent text-white placeholder-white/28"
            />
          </div>
        </label>

        <!-- Password -->
        <label class="flex flex-col gap-[.5rem]">
          <div class="flex justify-between">
            <span class="text-white/72 text-[.76rem]">Contraseña</span>

            <button
              type="button"
              class="p-0 border-0 bg-none text-white/60 text-[.72rem] cursor-pointer hover:text-white"
            >
              ¿La olvidaste?
            </button>
          </div>

          <div
            class="login-input-wrapper h-[50px] flex items-center gap-[.7rem] px-[.9rem] rounded-xl bg-black/16"
          >
            <fa-icon [icon]="faLock" size="sm" class="text-white/40"></fa-icon>

            <input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full h-full border-0 outline-none focus:outline-none focus:ring-0 bg-transparent text-white placeholder-white/28"
            />

            <button
              type="button"
              class="w-[30px] h-[30px] grid place-items-center border-0 rounded-lg bg-transparent text-white/40 cursor-pointer hover:text-white hover:bg-white/6"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              (click)="togglePassword()"
            >
              <fa-icon [icon]="passwordIcon" size="sm"></fa-icon>
            </button>
          </div>
        </label>

        <!-- Remember -->
        <label class="flex items-center gap-[.5rem] text-white/50 text-[.74rem] cursor-pointer">
          <input type="checkbox" class="accent-[var(--color-accent)]" />
          <span>Recordarme</span>
        </label>

        <!-- Submit -->
        <button
          (click)="onSubmit()"
          class="w-full h-[50px] flex items-center justify-between px-[1.15rem] py-[.35rem] border-0 rounded-xl bg-[var(--color-accent)] text-white text-[.84rem] font-semibold cursor-pointer shadow-[0_10px_25px_rgba(80,70,150,.25)] transition-all duration-200 hover:-translate-y-0.5 hover:brightness-[1.08]"
        >
          <span>Iniciar sesión</span>

          <span class="w-9 h-9 grid place-items-center rounded-lg bg-white/12">
            <fa-icon [icon]="faArrowRight" size="sm"></fa-icon>
          </span>
        </button>
      </form>

      <!-- Footer -->
      <div class="flex justify-center gap-[.3rem] mt-[1.6rem] text-white/40 text-[.72rem]">
        <span>¿Todavía no tienes una cuenta?</span>

        <button
          type="button"
          class="p-0 border-0 bg-none text-white/75 font-semibold hover:text-white"
        >
          Regístrate
        </button>
      </div>
    </section>
  </main>
</div>
