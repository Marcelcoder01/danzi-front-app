<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-50 w-64 transition-all duration-300 ease-in-out bg-base-200 border-r border-base-300 lg:translate-x-0 sidebar-bg mobile-bottom-nav"
    [class.w-64]="!isSidebarCollapsed"
    [class.w-24]="isSidebarCollapsed"
  >
    <app-sidebar
      [isCollapsed]="isSidebarCollapsed"
    ></app-sidebar>
  </aside>


  <!-- Main Content -->
  <div
    class="flex min-h-screen flex-1 flex-col
           transition-all duration-300 ease-in-out"
    [class.lg:ml-64]="!isSidebarCollapsed"
    [class.lg:ml-24]="isSidebarCollapsed"
  >

    <!-- Topbar -->
    <div class="sticky top-0 z-40">
      <app-topbar
        (toggleCollapse)="toggleSidebarCollapse()"
        [isCollapsed]="isSidebarCollapsed"
      ></app-topbar>
    </div>


    <!-- Page Content -->
    <main class="flex-1 main-bg">
      <router-outlet></router-outlet>
    </main>

  </div>


</div>
