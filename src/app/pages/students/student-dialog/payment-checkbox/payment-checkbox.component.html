<label class="payment-control">
  <span class="payment-copy">
    <span class="payment-title">Pago realizado</span>
    <span class="payment-description">Marcar como pagado</span>
  </span>
  <input
    class="payment-input"
    type="checkbox"
    [checked]="checked"
    (change)="onChange($event)"
    aria-label="Pago realizado"
  />
  <span class="payment-switch" aria-hidden="true"></span>
</label>
