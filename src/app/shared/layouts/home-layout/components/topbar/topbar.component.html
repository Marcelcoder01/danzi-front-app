<header
  class="sticky top-0 z-40 flex h-16 shrink-0 items-center justify-between px-6 shadow-lg topbar-header"
>
  <div class="flex items-center gap-4">
    <!-- Desktop Sidebar Toggle Button -->
    <button
      class="hidden lg:flex p-2 rounded-lg hover:bg-base-200 transition-all hover:shadow-md toggle-btn-bg"
      (click)="toggleCollapse.emit()"
      aria-label="Toggle sidebar"
    >
      @if (isCollapsed) {
        <fa-icon [icon]="faChevronRight" size="lg"></fa-icon>
      } @else {
        <fa-icon [icon]="faChevronLeft" size="lg"></fa-icon>
      }
    </button>

    <!-- Brand -->
    <div class="flex items-center gap-2">
      <span class="text-2xl brand-accent">✦</span>
      <div>
        <strong class="text-lg block brand-text">Bienvenido Maxi</strong>
        <small class="text-sm brand-muted">Admin baile</small>
      </div>
    </div>
  </div>

  <!-- Right side content (placeholder for future user menu) -->
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="rounded-lg p-2 transition-colors hover:bg-base-200"
      (click)="clearData()"
      aria-label="Borrar los datos guardados y empezar de cero"
      title="Limpiar datos"
    >
      <fa-icon [icon]="faRotate" aria-hidden="true"></fa-icon>
    </button>
    <div
      class="w-10 h-10 rounded-full flex items-center justify-center text-white font-semibold shadow-md avatar-bg"
    >
      AD
    </div>
  </div>
</header>
<app-confirmation-dialog (confirmed)="confirmClearData()"></app-confirmation-dialog>
