<div class="sidebar-content h-full flex flex-col p-4">
  <!-- Brand -->
  <div class="sidebar-brand mb-4 pb-2 lg:mb-3 lg:pb-1 xl:mb-2 xl:pb-1 border-b border-white/10">
    <div class="flex items-center justify-center">
      <img
        src="/assets/img/Danzi-logo-white.png"
        alt="Danzi Logo"
        [class]="
          isCollapsed
            ? 'pointer-events-none h-8 w-auto object-contain scale-[1.9]'
            : 'pointer-events-none h-16 w-auto object-contain scale-[3] lg:h-[72px] xl:h-20'
        "
      />
    </div>
  </div>
  <!-- Navigation -->
  <nav class="sidebar-nav flex-1 space-y-1">
    <a
      routerLink="/admin"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
    >
      <fa-icon [icon]="faGauge" size="lg"></fa-icon>
      <span class="desktop-label" [class.hidden]="isCollapsed">Panel Principal</span>
      <span class="mobile-label">Inicio</span>
    </a>
    <a
      [routerLink]="context.canManageStudents() ? '/admin/students' : '/admin/students/local'"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
    >
      <fa-icon [icon]="faUsers" size="lg"></fa-icon>
      <span class="desktop-label" [class.hidden]="isCollapsed">Alumnos</span>
      <span class="mobile-label">Alumnos</span>
    </a>
    @if (context.canManageStudents()) {
      <a
        routerLink="/admin/join-requests"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="desktop-only flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
      >
        <fa-icon [icon]="faInbox" size="lg"></fa-icon>
        <span class="desktop-label" [class.hidden]="isCollapsed">Solicitudes</span>
        <span class="mobile-label">Solicitudes</span>
      </a>
    }
    <a
      routerLink="/admin/classes"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
    >
      <fa-icon [icon]="faMusic" size="lg"></fa-icon>
      <span class="desktop-label" [class.hidden]="isCollapsed">Clases</span>
      <span class="mobile-label">Clases</span>
    </a>
    <!-- <a
      routerLink="/admin/calendar"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
      (click)="navigate.emit()"
    >
      <fa-icon [icon]="faCalendar" size="lg"></fa-icon>
      <span [class.hidden]="isCollapsed">Calendario</span>
    </a> -->
    <a
      routerLink="/admin/attendance"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
    >
      <fa-icon [icon]="faSquareCheck" size="lg"></fa-icon>
      <span class="desktop-label" [class.hidden]="isCollapsed">Asistencia</span>
      <span class="mobile-label">Asistencia</span>
    </a>
    <!-- <a
      routerLink="/admin/payments"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
      (click)="navigate.emit()"
    >
      <fa-icon [icon]="faCreditCard" size="lg"></fa-icon>
      <span [class.hidden]="isCollapsed">Pagos</span>
    </a> -->
    <!-- <a
      routerLink="/admin/validations"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
      (click)="navigate.emit()"
    >
      <fa-icon [icon]="faShieldHalved" size="lg"></fa-icon>
      <span [class.hidden]="isCollapsed">Validaciones</span>
    </a>
    <a
      routerLink="/admin/settings"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-5 py-3 rounded-lg transition-colors"
      (click)="navigate.emit()"
    >
      <fa-icon [icon]="faGear" size="lg"></fa-icon>
      <span [class.hidden]="isCollapsed">Ajustes</span>
    </a> -->
  </nav>

  <!-- Logout -->
  <div class="sidebar-logout pt-4 border-t border-white-10">
    <button
      class="flex items-center gap-3 px-5 py-3 w-full rounded-lg transition-colors"
      (click)="logout()"
    >
      <fa-icon [icon]="faRightFromBracket" size="lg"></fa-icon>
      <span class="desktop-label" [class.hidden]="isCollapsed">Cerrar Sesión</span>
      <span class="mobile-label">Salir</span>
    </button>
  </div>
</div>
