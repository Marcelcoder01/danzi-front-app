<dialog id="confirmation_dialog" class="modal modal-middle">
  <div
    class="modal-box w-[calc(100%-2rem)] max-w-md rounded-[28px] border border-white/10 bg-white p-0 shadow-[0_25px_80px_rgba(0,0,0,0.18),inset_1px_1px_0_rgba(255,255,255,0.45)]"
    aria-labelledby="confirmation-title"
    aria-describedby="confirmation-message"
  >
    <div class="p-6 sm:p-5">
      <div class="flex items-start justify-between gap-4">
        <div
          class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[rgba(245,101,101,.12)] text-[var(--color-error-dark)] shadow-[inset_2px_2px_5px_rgba(0,0,0,0.04),inset_-2px_-2px_5px_rgba(255,255,255,0.8)]"
        >
          <fa-icon [icon]="faTriangleExclamation" class="text-lg"></fa-icon>
        </div>
        <button
          type="button"
          aria-label="Cerrar diálogo"
          class="btn btn-ghost btn-sm btn-square rounded-xl text-[var(--color-text-muted)]"
          (click)="close()"
        >
          <fa-icon [icon]="faXmark"></fa-icon>
        </button>
      </div>

      <h2
        id="confirmation-title"
        class="mt-5 text-xl font-semibold tracking-tight text-[var(--color-text)]"
      >
        {{ options.title }}
      </h2>
      <p id="confirmation-message" class="mt-2 text-sm leading-6 text-[var(--color-text-muted)]">
        {{ options.message }}
      </p>

      <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button type="button" class="btn btn-ghost rounded-xl" (click)="close()">
          {{ options.cancelLabel ?? 'Cancelar' }}
        </button>
        <button
          type="button"
          class="btn rounded-xl border-0 bg-[var(--color-error-dark)] px-5 text-white hover:bg-[var(--color-error)]"
          (click)="confirm()"
        >
          {{ options.confirmLabel ?? 'Eliminar' }}
        </button>
      </div>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Cerrar diálogo">cerrar</button>
  </form>
</dialog>
